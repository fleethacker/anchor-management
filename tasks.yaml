---
# UDS Common owns disposable cluster setup; package builds are repository-owned.
includes:
  - setup: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.8.0/tasks/setup.yaml

variables:
  - name: ARCH
    default: ""
  - name: VERSION
    default: ""

tasks:
  - name: set-version
    description: Bump the package, bundle, and first-party charts together (set VERSION=x.y.z).
    actions:
      - cmd: node scripts/package-build.cjs set-version

  - name: prepare-package
    description: Build the checkout image and prepare concrete manifests with its unique image tag.
    actions:
      - cmd: node scripts/package-build.cjs prepare

  - name: create-package
    description: Build one versioned CASREP Command Zarf package for the selected architecture.
    actions:
      - task: prepare-package
      - cmd: node scripts/package-build.cjs package

  - name: create-test-bundle
    description: Build the image, package, and matching test bundle without deploying.
    actions:
      - task: create-package
      - cmd: node scripts/package-build.cjs bundle

  - name: verify
    description: Verify rollout and compare the running UI with the built checkout.
    actions:
      - cmd: node scripts/package-build.cjs verify

  - name: verify-inference
    description: Verify two real model responses and blocked paths in the deployed local UDS app.
    actions:
      - cmd: uds zarf tools kubectl rollout status deployment/casrep-command -n casrep-command --timeout=180s
      - cmd: >-
          uds zarf tools kubectl exec -n casrep-command deployment/casrep-command
          -c casrep-command -- node /app/scripts/verify-inference.cjs
          --base-url http://127.0.0.1:8080 --expect-text "controller reset" --wait-ms 90000

  - name: dev
    description: Build and deploy the checkout, then verify UI identity and real model inference.
    actions:
      - task: create-test-bundle
      - cmd: node scripts/package-build.cjs deploy
      - task: verify
      - task: verify-inference

  - name: default
    description: Create a disposable UDS Core test cluster, then build and deploy CASREP Command.
    actions:
      - task: setup:k3d-test-cluster
      - task: dev
