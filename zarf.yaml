kind: ZarfPackageConfig
metadata:
  name: casrep-command
  version: 0.1.1
  description: Airgap package for CASREP Command
  source: https://github.com/fleethacker/anchor-management
  vendor: Fleethacker
documentation:
  configuration.md: docs/configuration.md
  dependencies.md: docs/dependencies.md
components:
  - name: casrep-command
    required: true
    import:
      path: common
      name: casrep-command
    imageArchives:
      - path: images/casrep-command.tar
        images:
          - zarf.internal/casrep-command:0.1.1
values:
  files:
    - zarf-values.yaml
  schema: zarf-values.schema.json
