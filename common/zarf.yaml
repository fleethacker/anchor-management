kind: ZarfPackageConfig
metadata:
  name: casrep-command
  version: dev
components:
  - name: casrep-command
    required: true
    charts:
      - name: uds-casrep-command-config
        namespace: casrep-command
        localPath: ../config
      - name: casrep-command
        namespace: casrep-command
        localPath: ../chart
        # Clear server-defaulted rollingUpdate during the Recreate transition.
        serverSideApply: "false"
        valuesFiles:
          - ../values/common-values.yaml
          - ../values/upstream-values.yaml
        values:
          - sourcePath: .app.resources
            targetPath: .resources
          - sourcePath: .app.storageSize
            targetPath: .persistence.size
          - sourcePath: .app.podAnnotations
            targetPath: .podAnnotations
          - sourcePath: .app.nodeSelector
            targetPath: .nodeSelector
          - sourcePath: .app.tolerations
            targetPath: .tolerations
          - sourcePath: .app.affinity
            targetPath: .affinity
  - name: casrep-command-local
    required: true
    charts:
      - name: uds-casrep-command-config
        namespace: casrep-command
        localPath: ../config
      - name: casrep-command
        namespace: casrep-command
        localPath: ../chart
        # Clear server-defaulted rollingUpdate during the Recreate transition.
        serverSideApply: "false"
        valuesFiles:
          - ../values/common-values.yaml
          - ../values/local-values.yaml
        values:
          - sourcePath: .app.resources
            targetPath: .resources
          - sourcePath: .app.storageSize
            targetPath: .persistence.size
          - sourcePath: .app.podAnnotations
            targetPath: .podAnnotations
          - sourcePath: .app.nodeSelector
            targetPath: .nodeSelector
          - sourcePath: .app.tolerations
            targetPath: .tolerations
          - sourcePath: .app.affinity
            targetPath: .affinity
