# Change `app` if this name is unavailable in your Fly organization.
app = "anchor-management-api"
primary_region = "iad"

[build]
  # fly resolves this path relative to the directory containing fly.toml.
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "anchor_management_data"
  destination = "/data"
  initial_size = "1gb"
