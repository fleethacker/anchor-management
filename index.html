<!doctype html>
<!--
LEAD CODER HANDOFF — CASREP ANALYSIS FRONTEND
Combined single-page workspace: CASREP registry/routing, PLAD templates,
W requisitions with NSN/JCN and casualty links, and AEGIS component analysis.
One application, one browser state, one set of page roots.
Fictional USS Constitution demo: 186 cases and 95 registered equipment items.
Self-contained HTML/CSS/JavaScript reference. Open this file in a browser.
The interface and deterministic demo analysis work without a server or framework.
All seeded records are fictional. No operational backend or AI provider is connected.

COMPONENT MAP
  #casrep-ui-styles             Embedded visual system and analysis layouts
  #casrep-demo-catalog          Fictional comparison scenarios and equipment catalog
  #casrep-aegis-model           AEGIS component scoring and evidence
  #casrep-aegis-demo            Fictional single-command mapped component records
  #casrep-data-model            CASREP demo records and local workflow model
  #casrep-material-model        Equipment, work orders and parts demo records
  #casrep-evidence-analysis     Case/part/system comparisons and evidence metrics
  #casrep-investigation-model   Investigation leads, relationships and cohort logic
  #casrep-equipment-history     Per-equipment recurrence flags, counts and history
  #casrep-ai-interface          Evidence packet, adapter contract and result validator
  #casrep-integration-hooks     Future backend/AI adapter insertion point
  #casrep-application           Rendering, navigation, dialogs and UI handlers

DATA SEAMS FOR THE FUTURE BACKEND
  In #casrep-application, cases(), assets(), workOrders() and requisitions()
  supply records to the views. recurrenceData(), intelligenceData() and analyzeRecords() consume
  the selected snapshot. Replace demo acquisition with an authorized data cache;
  retain stable event/asset/component IDs, source versions and profile/window scope.
  Current browser filters and demo workflow controls do not implement authorization.

AI HOOK
  Supply window.CASREP_AI_ADAPTER before #casrep-application executes.
  It exposes async getStatus() and async analyze(packet, question).
  Keep provider credentials and source-data authorization on the future backend.
  The frontend validates snapshot identity and cited case IDs before rendering results.
  No API key or provider endpoint is required to review this HTML.

STARTUP / NAVIGATION
  Fresh loads open Overview. CASREP Analysis opens AEGIS system. Casualty picture retains category
  and recurrence charts. Equipment history, Investigate, Relationships, Compare
  and AI analyst remain available. Repeat flags use all
  loaded equipment history; UPDATEs do not create new casualty cases or failures.

This is a complete page reference for integration, not a production backend.
-->

/* CASREP-first overview: category posture and reporting obligations. */
.casrep-overview-head { padding:22px 24px; margin-bottom:20px; background:#fff; border:1px solid #d7e0e8; border-left:4px solid #1769aa; border-radius:10px; }
.casrep-overview-head h1,.casrep-overview-head h2 { color:#173752; }
.category-strip { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin:0 0 22px; }
.category-tile { display:grid; grid-template-columns:1fr auto; align-items:center; gap:5px 14px; min-height:116px; padding:18px 20px; border:1px solid #ccdce9; border-top:3px solid #1769aa; border-radius:10px; background:#fff; color:#264e6e; text-align:left; }
.category-tile:hover { background:#f7fbff; border-color:#7faacf; box-shadow:0 3px 12px #082a4a0a; }
.category-tile h2,.category-tile h3,.category-tile .category-label { margin:0; color:#345c7b; font-size:13px; font-weight:750; }
.category-tile strong,.category-tile .category-count { grid-column:2; grid-row:1 / span 2; color:#173e5d; font-size:35px; font-weight:750; line-height:1; font-variant-numeric:tabular-nums; }
.category-tile p,.category-tile small,.category-tile .category-note { grid-column:1; margin:0; color:#667d92; font-size:11px; }
.category-tile.c3,.category-tile.cat3,.category-tile[data-category="C3"] { border-top-color:#c18b2c; }
.category-tile.c4,.category-tile.cat4,.category-tile[data-category="C4"] { border-top-color:#b63838; }
.overview-grid { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:22px; align-items:start; }
.overview-grid > * { min-width:0; }
.due-table th { background:#f1f6fb; }
.due-state { display:inline-flex; padding:3px 7px; border-radius:4px; background:#edf4fa; color:#2f658d; font-size:10px; font-weight:750; }
.due-state.overdue { background:#fff0f0; color:#ae3333; }
.due-state.upcoming { background:#edf5fb; color:#1769aa; }
.due-state.today { background:#fff5df; color:#96620d; }
.category-register { margin:0 0 20px; }
.category-register > h2,.category-register > h3,.category-register .category-register-heading { display:flex; align-items:center; gap:10px; margin:0; padding:14px 18px; border-bottom:1px solid #dbe5ed; background:#f6f9fc; color:#244a68; font-size:14px; font-weight:750; }
.category-register .panel-head { background:#f7fafc; }
.comparison-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px; align-items:start; }
.comparison-grid > * { min-width:0; }
.rank-row { display:grid; grid-template-columns:26px minmax(0,1fr) auto; align-items:center; gap:10px; width:100%; padding:15px 18px; border:0; border-bottom:1px solid #e1e9f0; background:#fff; color:#315674; text-align:left; }
.rank-row:hover { background:#f4f9fd; }
.rank-row:last-child { border-bottom:0; }
.rank-number { display:grid; place-items:center; width:25px; height:25px; border-radius:5px; color:#386d96; background:#eaf3fa; font-size:11px; font-weight:750; }
.rank-row strong { color:#244c6a; }
.rank-row small { display:block; margin-top:3px; color:#6b8296; }
.rank-bar-track { height:6px; margin-top:8px; border-radius:3px; background:#e7eff6; overflow:hidden; }
.rank-bar-fill { display:block; height:100%; border-radius:inherit; background:#4e8ebd; }
.overview-grid { grid-template-columns:minmax(0,1fr) 285px; }
.category-register { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px; }
.category-register .panel { margin:0; }
.category-case { display:block; width:100%; padding:16px 18px; text-align:left; border:0; border-bottom:1px solid #dce6ef; background:#fff; color:#244a68; }
.category-case:last-child { border-bottom:0; }
.category-case:hover { background:#f1f7fc; }
.category-case > strong { display:block; margin:6px 0; font-size:13px; }
.category-case-footer { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; }
.category-tile > span:last-child { display:flex; gap:10px; align-items:center; font-size:12px; }
.deadline-note { margin:0; padding:12px 18px; border-top:1px solid #dce6ef; color:#637187; background:#f7fafc; font-size:11px; }
.route-summary { display:grid; gap:12px; }
.routing-summary-row { display:flex; align-items:center; gap:12px; padding:12px 0; border:0; border-bottom:1px solid #dce6ef; background:transparent; color:#244a68; text-align:left; font-size:12px; }
.routing-summary-row strong { margin-left:auto; font-size:18px; color:#1769aa; }
.routing-summary-row:hover { color:#1769aa; }

.rank-body > strong { display:block; margin-bottom:4px; font-size:14px; }

.rank-count small { font-size:10px; font-weight:500; }
.comparison-details { margin:0 0 20px; padding:16px 18px; border:1px solid #d7e0e8; border-radius:10px; background:#fff; }

.comparison-evidence small,.evidence-copy { display:block; }

@media(max-width:900px){.category-register{grid-template-columns:1fr}.comparison-toolbar{align-items:flex-start;flex-direction:column}}
@media(max-width:1100px){.overview-grid,.comparison-grid{grid-template-columns:1fr}.category-tile{padding:17px}.category-tile strong,.category-tile .category-count{font-size:30px}}
@media(max-width:900px){.nav-item{font-size:0}.app.sidebar-open .nav-item{font-size:13px}}
@media(max-width:640px){.category-strip{grid-template-columns:1fr;gap:10px}.category-tile{min-height:90px}.casrep-overview-head{padding:18px}.overview-grid,.comparison-grid{gap:16px}.rank-row{padding:13px 15px}}

/* Analysis workbench. Uses the current navy / blue / slate visual family. */
.analysis-shell {
  --analysis-ink:#173752;
  --analysis-muted:#60748a;
  --analysis-line:#d7e2ec;
  --analysis-blue:#1769aa;
  min-width:0;
}
.analysis-nav {
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
  margin:0 0 24px;
  padding:5px;
  border:1px solid #d6e1eb;
  border-radius:10px;
  background:#e5edf5;
}
.analysis-nav button {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:40px;
  padding:9px 18px;
  border:1px solid transparent;
  border-radius:7px;
  background:transparent;
  color:#506b84;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.analysis-nav button:hover { color:#124e7d; background:#f5f9fc; }
.analysis-nav button.active,.analysis-nav button[aria-selected="true"] {
  color:#115e9b;
  background:#fff;
  border-color:#c5d8e8;
  box-shadow:0 1px 3px #082a4a0a;
}
.analysis-nav button svg { width:17px; height:17px; }
.analysis-toolbar,.analysis-filter-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin:0 0 20px;
}
.analysis-toolbar .search-box { max-width:460px; }
.analysis-subtitle { margin:4px 0 0; color:#60748a; font-size:12px; line-height:1.65; }
.analysis-summary {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
  margin:0 0 24px;
}
.metric-cell {
  min-width:0;
  padding:18px 20px;
  border:1px solid #d6e1eb;
  border-radius:9px;
  background:#fff;
}
.metric-cell > span:first-child,.metric-cell > small:first-child {
  display:block;
  color:#546e85;
  font-size:10px;
  font-weight:750;
  letter-spacing:.045em;
  text-transform:uppercase;
}
.metric-value { display:block; margin:7px 0 5px; color:#173f60; font-size:29px; font-weight:750; line-height:1.12; letter-spacing:-.8px; font-variant-numeric:tabular-nums; }
.metric-description { display:block; color:#667b90; font-size:11px; line-height:1.5; }
.analysis-workgrid { display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:22px; align-items:start; }
.analysis-workgrid > *,.relationship-layout > *,.ai-layout > * { min-width:0; }
.lead-list { display:grid; gap:16px; }
.investigation-card {
  min-width:0;
  padding:21px 22px 0;
  border:1px solid #d4e1ec;
  border-left:3px solid #3a7fb5;
  border-radius:9px;
  background:#fff;
}
.lead-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:10px; }
.lead-head h2,.lead-head h3,.lead-head strong { margin:0; color:#193f5e; font-size:16px; font-weight:750; line-height:1.4; }
.lead-head p { margin:4px 0 0; color:#667c91; font-size:11px; }
.lead-priority {
  display:inline-flex;
  align-items:center;
  flex-shrink:0;
  padding:4px 8px;
  border-radius:5px;
  background:#eaf3fb;
  color:#1769aa;
  font-size:10px;
  font-weight:750;

@media(max-width:1180px) {

}

  .analysis-workgrid,.relationship-layout,.ai-layout { grid-template-columns:1fr; }

}

  function aiUiAction(button) {

      if(action==='prepare'){state.aiPacket=buildAIPacket();state.aiError='';render();toast('Evidence packet prepared. Review its contents before a backend handoff.');return true;}
      if(action==='export-packet'){var packet=buildAIPacket();state.aiPacket=packet;download('CASREP-AI-Request-'+packet.packetId+'.json',JSON.stringify(packet,null,2));render();toast('AI evidence request exported. No model was called.');return true;}

  async function aiAsyncAction(action) {
    state.aiBusy=action==='ask'?'analyze':'check';state.aiError='';render();
    try{
      var adapter=CasrepAIInterface.createAdapter();
      if(action==='check'){
        var status=await adapter.getStatus();state.aiConnection=status;
        toast(status.connected?'The developer-supplied backend reports connected.':'Backend not connected. The request/response workflow is available for handoff.');
      }else{
        if(!aiConnection().connected)throw new Error('Check a connected developer-supplied backend before requesting an AI analysis.');
        var packet=buildAIPacket();state.aiPacket=packet;
        var result=await adapter.analyze(packet,aiQuestion()),checked=CasrepAIInterface.validateResult(result,packet);
        if(!checked.valid)throw new Error('The response was not accepted: '+checked.errors.join(' '));
        state.aiResult=checked.value;state.aiResultOrigin='Response from '+(aiConnection().provider||'developer-supplied backend');
        toast(buildAIPacket().packetId===packet.packetId?'AI response accepted for technical review.':'Response received for the earlier snapshot; its content is hidden from the changed scope.');
      }
    }catch(error){
      state.aiError=error.message||String(error);
      if(action==='check')state.aiConnection={connected:false,provider:'Not available',message:state.aiError};
      toast(state.aiError,true);
    }finally{state.aiBusy='';render();}
  }
  async function handleAIImport(event) {
    if(!event.target||event.target.id!=='ai-response-file')return false;
    var file=event.target.files&&event.target.files[0];if(!file)return true;
    try{
      if(file.size>256*1024)throw new Error('Select a response JSON file no larger than 256 KB.');
      var raw=await file.text(),result;
      try{result=JSON.parse(raw);}catch(error){throw new Error('The selected file is not valid JSON.');}
      var packet=buildAIPacket(),checked=CasrepAIInterface.validateResult(result,packet);
      if(!checked.valid)throw new Error('Response rejected: '+checked.errors.join(' '));
      state.aiPacket=packet;state.aiResult=checked.value;
      state.aiResultOrigin=/^ILLUSTRATIVE RESPONSE/.test(result.summary)?'Illustrative frontend template (imported) · no model call':'Imported response · origin unverified';
      state.aiError='';render();toast('Response validated against the current evidence snapshot.');
    }catch(error){state.aiError=error.message||String(error);toast(state.aiError,true);render();}
    return true;
  }

    if(name==='deliver')return modal('Record delivery evidence',field('Evidence and required recipient scope *','note','','textarea',true,'required')+field('Required recipients still pending (if any)','pendingRecipients','','textarea',true),'Record delivery evidence',function(v){if(!execute(function(){store.transition(r.id,'deliver',v);},'Delivery evidence recorded.'))return false;});
    if(name==='followup')return modal('Create follow-on draft','<p class="form-intro">The transmitted version stays in the case history. The follow-on starts a fresh review.</p><div class="form-grid">'+selectField('Report type','type',['UPDATE','CORRECT','CANCEL'],'UPDATE')+'</div>','Create draft',function(v){if(!execute(function(){store.transition(r.id,'followup',v);},'Follow-on draft created.'))return false;});
    if(name==='close-case')return modal('Close reporting case','<p class="form-intro">Closure applies to reporting. Maintenance and parts records keep their independent status.</p>'+field(r.messageType==='CORRECT'?'Restoration / operational test evidence *':'Cancellation authority / unresolved condition *','evidence','','textarea',true,'required')+(r.messageType==='CORRECT'?field('Actual restoration time (local) *','restoredAt',localDate(r.restoredAt),'datetime-local',true,'required'):''),'Close reporting',function(v){if(!execute(function(){v.restoredAt=preservedISO(v.restoredAt,r.restoredAt);store.transition(r.id,'close',v);},'Reporting case closed.'))return false;});
    if(name==='reset')return modal('Reset fictional workspace','<p>This replaces local prototype edits with the original fictional cases and W requisitions. Saved PLAD templates are retained.</p>','Reset demo',function(){store.reset();material.reset();sheetClose();state.profile='FLEET';render();toast('Fictional workspace reset.');});
  }
  document.addEventListener('click',function(e){if(e.target.classList.contains('sheet-backdrop'))return sheetClose();var b=e.target.closest('button,a');if(!b)return;if(intelligenceClick(b)){e.preventDefault();return;}if(b.dataset.duePage!=null)return loadDuePage(Number(b.dataset.duePage));if(b.dataset.categoryJump){navigate('casreps');state.category=b.dataset.categoryJump;state.stage='active';return render();}if(b.dataset.failureBasis){state.failureBasis=b.dataset.failureBasis;return render();}if(b.dataset.view)return navigate(b.dataset.view);if(b.dataset.profile){state.profile=b.dataset.profile;return render();}if(b.dataset.open){if($('#modal-root').innerHTML)closeModal();return openRecord(b.dataset.open);}if(b.hasAttribute('data-close-sheet'))return sheetClose();if(b.hasAttribute('data-close-modal'))return closeModal();if(b.dataset.tab){state.tab=b.dataset.tab;return renderSheet();}if(b.dataset.analysisGroup)return inspectGroup(b.dataset.analysisGroup,b.dataset.key);if(b.dataset.action)return action(b.dataset.action,b.dataset.id);if(b.dataset.transition)return execute(function(){if(state.editorKey&&b.dataset.transition==='submit')return editorAction('submit');store.transition(state.record,b.dataset.transition,state.editorKey?editorPayload():{});},'Workflow updated.');if(b.dataset.concur)return execute(function(){if(!state.editorKey||!canReviewEditor()||editorSession().actor!=='demo-'+b.dataset.concur)throw new Error('Open the assigned review from Case workspace → Routing to acknowledge this revision.');store.transition(state.record,'concur',Object.assign(editorPayload(),{reviewId:b.dataset.concur}));},'Review concurrence recorded.');if(b.dataset.plad)return editPlad(b.dataset.plad);if(b.dataset.asset)return equipmentDetail(b.dataset.asset);if(b.dataset.work)return editWork(b.dataset.work);if(b.dataset.requisition)return editReq(b.dataset.requisition);});
  document.addEventListener('change',function(e){if(intelligenceChange(e))return;if(e.target.id==='due-horizon'){state.dueHorizon=e.target.value;return backend.connected?loadDuePage(0):render();}if(e.target.id==='analysis-window'){state.analysisWindow=e.target.value;return render();}if(e.target.name==='pladTemplateId'){var template=pladStore.get(e.target.value),recipients=$('[name="recipients"]',$('#action-form'));if(template&&recipients)recipients.value=template.recipients;return;}if(e.target.name==='assetId'&&$('#action-form [name=equipment]')){var a=material.assets().find(function(a){return a.id===e.target.value;});if(a){['equipment','system','location'].forEach(function(key){var el=$('#action-form [name='+key+']');if(el)el.value=key==='equipment'?a.name:a[key];});}}if(e.target.id==='category-filter'){state.category=e.target.value;return render();}if(e.target.id==='stage-filter'){state.stage=e.target.value;return render();}if(e.target.dataset.workStatus)return execute(function(){material.setWorkStatus(e.target.dataset.workStatus,e.target.value);},'Work status saved.');if(e.target.dataset.reqStatus)return execute(function(){material.setReqStatus(e.target.dataset.reqStatus,e.target.value);},'Material status saved.');});
  document.addEventListener('input',function(e){if(recurrenceInput(e))return;if(e.target.id==='ai-question'){state.aiQuestion=e.target.value;if(state.aiResult){var aiText=e.target.value,aiPos=e.target.selectionStart;clearTimeout(state.aiTypingTimer);state.aiTypingTimer=setTimeout(function(){render();var input=$('#ai-question');if(input){input.focus();input.setSelectionRange(aiPos,aiPos);}},550);}return;}if(e.target.id==='case-search'){state.search=e.target.value;var focus=e.target.selectionStart;var rows=cases().filter(function(r){return (state.category==='all'||r.category===state.category)&&(state.stage==='all'||(state.stage==='active'?r.caseStatus==='Active':state.stage==='closed'?r.caseStatus!=='Active':r.caseStatus==='Active'&&r.stage===state.stage))&&(!state.search||[r.number,r.title,r.equipment,r.description].join(' ').toLowerCase().includes(state.search.toLowerCase()));});$('#registry-results').innerHTML=caseTable(rows);$('#registry-count').textContent=rows.length+' of '+cases().length+' records';e.target.setSelectionRange(focus,focus);}if(e.target.id==='equipment-search'){state.equipmentSearch=e.target.value;var pos=e.target.selectionStart;render();$('#equipment-search').focus();$('#equipment-search').setSelectionRange(pos,pos);}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){if($('#modal-root').innerHTML)closeModal();}if(e.key==='Tab'){var dialog=$('#modal-root .modal')||$('.detail-sheet');if(!dialog)return;var focusable=$$('button:not([disabled]),input,select,textarea,a[href],[tabindex="0"]',dialog).filter(function(el){return el.offsetParent!==null;});if(!focusable.length)return;var first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  $('#menu-toggle').addEventListener('click',function(){$('#app').classList.toggle('sidebar-open');});$('#policy-shortcut').addEventListener('click',function(){navigate('policy');});window.addEventListener('hashchange',function(){var view=location.hash.slice(1);if(view.startsWith('casrep/')){var key=decodeURIComponent(view.slice(7));if(key!==state.editorKey){try{showEditor(key==='new'?null:key,true);}catch(error){toast(error.message,true);navigate('casreps');}}}else if(views[view]&&(view!==state.view||state.editorKey)){state.editorKey=null;state.record=null;state.view=view;render();}});var initialHash=location.hash.slice(1);if(initialHash.startsWith('casrep/')){try{var initialKey=decodeURIComponent(initialHash.slice(7));showEditor(initialKey==='new'?null:initialKey,true);}catch(error){navigate('casreps');toast(error.message,true);}}else{state.view=views[initialHash]?initialHash:'overview';history.replaceState(null,'','#'+state.view);render();}
  window.ReadinessApp={store:store,material:material,state:state,render:render,openRecord:openRecord,pladStore:pladStore};
  connectBackend();
})();
</script>
</body>
