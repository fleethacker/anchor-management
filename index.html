<!doctype html>
<!--
LEAD CODER HANDOFF — CASREP ANALYSIS FRONTEND
Combined single-page workspace: CASREP registry/routing, PLAD templates,
W requisitions with NSN/JCN and casualty links, and AEGIS component analysis.
One application, one browser state, one set of page roots.
Fictional USS Constitution demo: 186 cases and 95 registered equipment items.
Self-contained HTML/CSS/JavaScript reference. Open this file in a browser.
The interface and deterministic demo analysis work without a server or framework.
All seeded records are fictional. No operational backend or AI provider is connected.

COMPONENT MAP
  #casrep-ui-styles             Embedded visual system and analysis layouts
  #casrep-demo-catalog          Fictional comparison scenarios and equipment catalog
  #casrep-aegis-model           AEGIS component scoring and evidence
  #casrep-aegis-demo            Fictional single-command mapped component records
  #casrep-data-model            CASREP demo records and local workflow model
  #casrep-material-model        Equipment, work orders and parts demo records
  #casrep-evidence-analysis     Case/part/system comparisons and evidence metrics
  #casrep-investigation-model   Investigation leads, relationships and cohort logic
  #casrep-equipment-history     Per-equipment recurrence flags, counts and history
  #casrep-ai-interface          Evidence packet, adapter contract and result validator
  #casrep-integration-hooks     Future backend/AI adapter insertion point
  #casrep-application           Rendering, navigation, dialogs and UI handlers

DATA SEAMS FOR THE FUTURE BACKEND
  In #casrep-application, cases(), assets(), workOrders() and requisitions()
  supply records to the views. recurrenceData(), intelligenceData() and analyzeRecords() consume
  the selected snapshot. Replace demo acquisition with an authorized data cache;
  retain stable event/asset/component IDs, source versions and profile/window scope.
  Current browser filters and demo workflow controls do not implement authorization.

AI HOOK
  Supply window.CASREP_AI_ADAPTER before #casrep-application executes.
  It exposes async getStatus() and async analyze(packet, question).
  Keep provider credentials and source-data authorization on the future backend.
  The frontend validates snapshot identity and cited case IDs before rendering results.
  No API key or provider endpoint is required to review this HTML.

STARTUP / NAVIGATION
  Fresh loads open Overview. CASREP Analysis opens AEGIS system. Casualty picture retains category
  and recurrence charts. Equipment history, Investigate, Relationships, Compare
  and AI analyst remain available. Repeat flags use all
  loaded equipment history; UPDATEs do not create new casualty cases or failures.

This is a complete page reference for integration, not a production backend.
-->

/* CASREP-first overview: category posture and reporting obligations. */
.casrep-overview-head { padding:22px 24px; margin-bottom:20px; background:#fff; border:1px solid #d7e0e8; border-left:4px solid #1769aa; border-radius:10px; }
.casrep-overview-head h1,.casrep-overview-head h2 { color:#173752; }
.category-strip { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin:0 0 22px; }
.category-tile { display:grid; grid-template-columns:1fr auto; align-items:center; gap:5px 14px; min-height:116px; padding:18px 20px; border:1px solid #ccdce9; border-top:3px solid #1769aa; border-radius:10px; background:#fff; color:#264e6e; text-align:left; }
.category-tile:hover { background:#f7fbff; border-color:#7faacf; box-shadow:0 3px 12px #082a4a0a; }
.category-tile h2,.category-tile h3,.category-tile .category-label { margin:0; color:#345c7b; font-size:13px; font-weight:750; }
.category-tile strong,.category-tile .category-count { grid-column:2; grid-row:1 / span 2; color:#173e5d; font-size:35px; font-weight:750; line-height:1; font-variant-numeric:tabular-nums; }
.category-tile p,.category-tile small,.category-tile .category-note { grid-column:1; margin:0; color:#667d92; font-size:11px; }
.category-tile.c3,.category-tile.cat3,.category-tile[data-category="C3"] { border-top-color:#c18b2c; }
.category-tile.c4,.category-tile.cat4,.category-tile[data-category="C4"] { border-top-color:#b63838; }
.overview-grid { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:22px; align-items:start; }
.overview-grid > * { min-width:0; }
.due-table th { background:#f1f6fb; }
.due-state { display:inline-flex; padding:3px 7px; border-radius:4px; background:#edf4fa; color:#2f658d; font-size:10px; font-weight:750; }
.due-state.overdue { background:#fff0f0; color:#ae3333; }
.due-state.upcoming { background:#edf5fb; color:#1769aa; }
.due-state.today { background:#fff5df; color:#96620d; }
.category-register { margin:0 0 20px; }
.category-register > h2,.category-register > h3,.category-register .category-register-heading { display:flex; align-items:center; gap:10px; margin:0; padding:14px 18px; border-bottom:1px solid #dbe5ed; background:#f6f9fc; color:#244a68; font-size:14px; font-weight:750; }
.category-register .panel-head { background:#f7fafc; }
.comparison-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px; align-items:start; }
.comparison-grid > * { min-width:0; }
.rank-row { display:grid; grid-template-columns:26px minmax(0,1fr) auto; align-items:center; gap:10px; width:100%; padding:15px 18px; border:0; border-bottom:1px solid #e1e9f0; background:#fff; color:#315674; text-align:left; }
.rank-row:hover { background:#f4f9fd; }
.rank-row:last-child { border-bottom:0; }
.rank-number { display:grid; place-items:center; width:25px; height:25px; border-radius:5px; color:#386d96; background:#eaf3fa; font-size:11px; font-weight:750; }
.rank-row strong { color:#244c6a; }
.rank-row small { display:block; margin-top:3px; color:#6b8296; }
.rank-bar-track { height:6px; margin-top:8px; border-radius:3px; background:#e7eff6; overflow:hidden; }
.rank-bar-fill { display:block; height:100%; border-radius:inherit; background:#4e8ebd; }
.overview-grid { grid-template-columns:minmax(0,1fr) 285px; }
.category-register { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px; }
.category-register .panel { margin:0; }
.category-case { display:block; width:100%; padding:16px 18px; text-align:left; border:0; border-bottom:1px solid #dce6ef; background:#fff; color:#244a68; }
.category-case:last-child { border-bottom:0; }
.category-case:hover { background:#f1f7fc; }
.category-case > strong { display:block; margin:6px 0; font-size:13px; }
.category-case-footer { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; }
.category-tile > span:last-child { display:flex; gap:10px; align-items:center; font-size:12px; }
.deadline-note { margin:0; padding:12px 18px; border-top:1px solid #dce6ef; color:#637187; background:#f7fafc; font-size:11px; }
.route-summary { display:grid; gap:12px; }
.routing-summary-row { display:flex; align-items:center; gap:12px; padding:12px 0; border:0; border-bottom:1px solid #dce6ef; background:transparent; color:#244a68; text-align:left; font-size:12px; }
.routing-summary-row strong { margin-left:auto; font-size:18px; color:#1769aa; }
.routing-summary-row:hover { color:#1769aa; }
.comparison-toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:0 0 22px; font-size:12px; }
.rank-body,.rank-bar-track { display:block; }
.rank-body > strong { display:block; margin-bottom:4px; font-size:14px; }
.rank-count { min-width:42px; text-align:center; color:#1769aa; font-size:26px; font-weight:750; }
.rank-count small { font-size:10px; font-weight:500; }
.comparison-details { margin:0 0 20px; padding:16px 18px; border:1px solid #d7e0e8; border-radius:10px; background:#fff; }
.comparison-details > summary { font-weight:700; color:#244a68; }
.comparison-details > .analytics-grid { margin-top:20px; }
.comparison-evidence small,.evidence-copy { display:block; }
.evidence-copy { margin-top:8px; font-size:12px; line-height:1.55; color:#4e6a80; }
.mini-trends { display:grid; gap:10px; }
.mini-trends > div { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #dce6ef; }
@media(max-width:900px){.category-register{grid-template-columns:1fr}.comparison-toolbar{align-items:flex-start;flex-direction:column}}
@media(max-width:1100px){.overview-grid,.comparison-grid{grid-template-columns:1fr}.category-tile{padding:17px}.category-tile strong,.category-tile .category-count{font-size:30px}}
@media(max-width:900px){.nav-item{font-size:0}.app.sidebar-open .nav-item{font-size:13px}}
@media(max-width:640px){.category-strip{grid-template-columns:1fr;gap:10px}.category-tile{min-height:90px}.casrep-overview-head{padding:18px}.overview-grid,.comparison-grid{gap:16px}.rank-row{padding:13px 15px}}

/* Analysis workbench. Uses the current navy / blue / slate visual family. */
.analysis-shell {
  --analysis-ink:#173752;
  --analysis-muted:#60748a;
  --analysis-line:#d7e2ec;
  --analysis-blue:#1769aa;
  min-width:0;
}
.analysis-nav {
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
  margin:0 0 24px;
  padding:5px;
  border:1px solid #d6e1eb;
  border-radius:10px;
  background:#e5edf5;
}
.analysis-nav button {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:40px;
  padding:9px 18px;
  border:1px solid transparent;
  border-radius:7px;
  background:transparent;
  color:#506b84;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
.analysis-nav button:hover { color:#124e7d; background:#f5f9fc; }
.analysis-nav button.active,.analysis-nav button[aria-selected="true"] {
  color:#115e9b;
  background:#fff;
  border-color:#c5d8e8;
  box-shadow:0 1px 3px #082a4a0a;
}
.analysis-nav button svg { width:17px; height:17px; }
.analysis-toolbar,.analysis-filter-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin:0 0 20px;
}
.analysis-toolbar .search-box { max-width:460px; }
.analysis-subtitle { margin:4px 0 0; color:#60748a; font-size:12px; line-height:1.65; }
.analysis-summary {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
  margin:0 0 24px;
}
.metric-cell {
  min-width:0;
  padding:18px 20px;
  border:1px solid #d6e1eb;
  border-radius:9px;
  background:#fff;
}
.metric-cell > span:first-child,.metric-cell > small:first-child {
  display:block;
  color:#546e85;
  font-size:10px;
  font-weight:750;
  letter-spacing:.045em;
  text-transform:uppercase;
}
.metric-value { display:block; margin:7px 0 5px; color:#173f60; font-size:29px; font-weight:750; line-height:1.12; letter-spacing:-.8px; font-variant-numeric:tabular-nums; }
.metric-description { display:block; color:#667b90; font-size:11px; line-height:1.5; }
.analysis-workgrid { display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:22px; align-items:start; }
.analysis-workgrid > *,.relationship-layout > *,.ai-layout > * { min-width:0; }
.lead-list { display:grid; gap:16px; }

  min-width:0;
  padding:21px 22px 0;
  border:1px solid #d4e1ec;
  border-left:3px solid #3a7fb5;
  border-radius:9px;
  background:#fff;
}

  align-items:center;

.relationship-layout { display:grid; grid-template-columns:290px minmax(0,1fr); gap:22px; align-items:start; }

.relationship-table { width:100%; overflow:auto; }
.relationship-table table { min-width:650px; }
.relationship-directory { min-width:0; }
.relationship-filter { display:grid; gap:8px; margin-bottom:10px; }
.relationship-filter > span { color:#385f7d; font-size:12px; font-weight:700; }
.relationship-filter select { width:100%; max-width:none; }
.relationship-focus-card { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:12px; padding:21px 22px; border:1px solid #bed5e7; border-left:4px solid #1769aa; border-radius:8px; background:#fff; }

.relationship-focus-card p { margin:0; color:#688095; font-size:12px; }
.relationship-hub-icon { display:grid; place-items:center; width:46px; height:46px; flex-shrink:0; border-radius:8px; color:#3677a8; background:#edf5fc; }
.relationship-instruction { margin:0 0 15px; color:#688095; font-size:12px; line-height:1.65; }
.relationship-neighbors { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; margin-bottom:22px; }
.relationship-node > span:last-child { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.relationship-direction { display:inline-flex; align-items:center; margin:0 8px; color:#7d99af; }
.relationship-table td:first-child { min-width:210px; }
.relationship-table td:first-child > strong { font-size:11px; }
.relationship-table .badge { white-space:normal; }
.evidence-pill { display:inline-flex; align-items:center; gap:5px; margin:3px 5px 3px 0; padding:4px 7px; border:1px solid #cddfec; border-radius:4px; background:#edf5fb; color:#17649c; font-size:10px; font-weight:650; line-height:1.4; text-decoration:none; }
button.evidence-pill:hover,a.evidence-pill:hover { background:#dfeefa; border-color:#9cbfda; }
.comparison-matrix { min-width:0; overflow:auto; }
.comparison-matrix table { min-width:720px; }
.comparison-matrix th:first-child,.comparison-matrix td:first-child { min-width:170px; background:#f5f9fc; }
.compare-summary { display:flex; align-items:center; justify-content:space-between; gap:15px; margin-bottom:20px; padding:15px 18px; border:1px solid #d6e2ed; border-radius:8px; background:#f7fafc; color:#57768e; font-size:12px; }
.compare-summary strong { color:#254c6b; }
.compare-selection { display:flex; align-items:center; gap:8px; padding:8px 11px; border:1px solid #cbddeb; border-radius:6px; background:#fff; color:#325c7b; font-size:12px; }
.compare-selection input { width:15px; height:15px; margin:0; accent-color:#1769aa; }
.compare-selection:has(input:checked) { border-color:#71a4cb; background:#edf6fd; }
.ai-layout { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:22px; align-items:start; }
.ai-prompt { min-width:0; }
.ai-prompt textarea,textarea.ai-prompt { display:block; width:100%; min-height:135px; padding:13px 14px; border:1px solid #cbdce9; border-radius:7px; background:#fff; color:#24455f; font-size:13px; line-height:1.65; resize:vertical; }
.ai-prompt label { display:block; margin-bottom:8px; color:#345c7b; font-size:12px; font-weight:700; }
.ai-empty { padding:28px 23px; border:1px dashed #bdcfdf; border-radius:8px; background:#f9fbfd; color:#6a8094; text-align:center; }
.ai-empty h3 { margin:10px 0 7px; color:#345b78; font-size:16px; }
.ai-empty p { max-width:510px; margin:0 auto; font-size:12px; line-height:1.7; }
.ai-empty > svg { color:#7198b7; }
.ai-status,.connection-status { display:inline-flex; align-items:center; gap:7px; padding:5px 9px; border:1px solid #d5e0e9; border-radius:5px; color:#5b7287; background:#f2f6fa; font-size:10px; font-weight:700; line-height:1.4; }
.ai-status::before,.connection-status::before { content:''; width:6px; height:6px; flex-shrink:0; border-radius:50%; background:#8d9eac; }
.ai-status.connected,.connection-status.connected { color:#155d91; border-color:#b6d2e6; background:#edf6fd; }
.ai-status.connected::before,.connection-status.connected::before { background:#1769aa; }
.ai-status.pending,.connection-status.pending { color:#8e630e; border-color:#e4d5ad; background:#fff8e7; }
.ai-status.pending::before,.connection-status.pending::before { background:#b5852a; }
.hypothesis-card { margin-bottom:16px; padding:20px 21px; border:1px solid #d1e1ec; border-left:3px solid #8ca8c0; border-radius:8px; background:#fff; }
.hypothesis-card h3 { margin:9px 0; color:#214d70; font-size:15px; line-height:1.45; }
.hypothesis-card p,.hypothesis-card li { color:#5c768d; font-size:12px; line-height:1.7; }
.hypothesis-card ul { margin-bottom:13px; padding-left:19px; }
.hypothesis-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:15px; padding-top:13px; border-top:1px solid #e0e8ef; }
.hypothesis-label { display:inline-flex; align-items:center; gap:6px; color:#7a6121; background:#fff5dc; border:1px solid #e7d7ac; border-radius:4px; padding:3px 7px; font-size:10px; font-weight:750; }
.packet-preview { display:block; max-height:360px; margin:12px 0 0; padding:14px 15px; overflow:auto; border:1px solid #d4e2ee; border-radius:7px; color:#325b79; background:#f3f7fb; font:11px/1.6 Consolas,"Courier New",monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
.data-gap-list { margin:10px 0 0; padding-left:18px; }
.data-gap-list li { margin:6px 0; color:#62798d; font-size:12px; line-height:1.6; }
.analysis-banner { display:flex; align-items:flex-start; gap:12px; margin:0 0 20px; padding:14px 16px; border:1px solid #ccdfed; border-left:3px solid #4e8dbb; border-radius:7px; color:#4b6b85; background:#eff6fc; font-size:12px; line-height:1.7; }
.analysis-banner > svg { flex-shrink:0; margin-top:2px; color:#4b83ad; }
.analysis-banner p { margin:0; }
.analysis-banner strong { color:#264f70; }
.analysis-call-to-action { display:flex; align-items:center; justify-content:space-between; gap:20px; margin:20px 0; padding:18px 20px; border:1px solid #c9deed; border-radius:8px; background:#f0f7fc; color:#426b89; }
.analysis-call-to-action strong { display:block; color:#224d6c; font-size:14px; }
.analysis-call-to-action p { margin:5px 0 0; font-size:12px; line-height:1.6; }
.investigation-detail { min-width:0; color:#54718b; font-size:13px; line-height:1.7; }
.investigation-detail h3 { margin:21px 0 10px; color:#254c6b; font-size:14px; }
.investigation-detail p { margin-bottom:10px; }
.investigation-checks { margin:11px 0; padding-left:20px; }
.investigation-checks li { margin:8px 0; padding-left:3px; color:#557189; font-size:12px; line-height:1.7; }
.investigation-checks li::marker { color:#4c83ad; font-weight:700; }
.method-disclosure { margin:16px 0 0; padding-top:14px; border-top:1px solid #dee7ef; color:#698095; font-size:11px; line-height:1.65; }
.method-disclosure summary { cursor:pointer; color:#345c7b; font-weight:700; }
.method-disclosure p { margin:9px 0 0; }
.lens-count { display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:19px; padding:0 5px; border-radius:4px; background:#d8e5f1; color:#55748e; font-size:10px; font-weight:700; }
.analysis-nav .active .lens-count { color:#1769aa; background:#e5f0f9; }
.explainer-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
.explainer-grid > section,.explainer-grid > div { min-width:0; }
.explainer-grid h3 { margin:0 0 8px; color:#315675; font-size:13px; }
.explainer-grid p,.explainer-grid li { color:#647c91; font-size:12px; line-height:1.65; }
@media(max-width:1180px) {
  .analysis-workgrid { grid-template-columns:minmax(0,1fr) 280px; }
  .ai-layout { grid-template-columns:minmax(0,1fr) 300px; }
  .relationship-layout { grid-template-columns:250px minmax(0,1fr); }
  .analysis-nav button { padding-left:13px; padding-right:13px; }
}
@media(max-width:1000px) {
  .analysis-workgrid,.ai-layout,.relationship-layout { grid-template-columns:1fr; }
  .analysis-sidebar { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .entity-list { grid-template-columns:repeat(2,minmax(0,1fr)); max-height:250px; }
  .analysis-summary { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media(max-width:680px) {
  .analysis-nav { gap:3px; padding:4px; }
  .analysis-nav button { flex:1 1 calc(50% - 3px); min-height:38px; padding:8px 6px; font-size:11px; }
  .analysis-summary { gap:10px; }
  .metric-cell { padding:14px; }
  .metric-value { font-size:25px; }
  .metric-description { font-size:10px; }
  .analysis-sidebar,.entity-list,.relationship-flow,.relationship-neighbors,.explainer-grid { grid-template-columns:1fr; }
  .lead-head { flex-wrap:wrap; gap:8px; }
  .lead-head h2,.lead-head h3,.lead-head strong { font-size:15px; }
  .investigation-card { padding:17px 17px 0; }
  .lead-footer { margin-left:-17px; margin-right:-17px; padding:12px 16px; flex-wrap:wrap; }
  .analysis-call-to-action,.compare-summary { align-items:flex-start; flex-direction:column; }
  .relationship-node { min-height:100px; }
}
@media print {
  .analysis-nav,.hypothesis-actions,.analysis-toolbar .btn,.analysis-filter-row .btn { display:none!important; }
  .analysis-workgrid,.relationship-layout,.ai-layout { grid-template-columns:1fr; }
  .investigation-card,.hypothesis-card,.method-card { break-inside:avoid; box-shadow:none; }
  .packet-preview { max-height:none; overflow:visible; }
}

/* One-page landscape command overview. */
#overview-report-root { position:fixed; inset:0; z-index:160; overflow:auto; background:#e8edf2; padding:20px; }
body.overview-reporting { overflow:hidden; }
.brief-preview-toolbar { max-width:11in; margin:0 auto 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; color:#35536c; font-size:12px; }

.brief-asof span { display:block; margin-top:4px; color:#5a7183; }
.brief-metrics { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; }
.brief-metric { padding:7px 9px; border:1px solid #d2dde5; border-top:3px solid #4d6c86; }
.brief-metric strong { display:block; font-size:23px; line-height:1.1; }
.brief-metric span { display:block; font-size:9px; margin-top:4px; }

.co-brief th { padding:6px; background:#edf2f6; font-size:9px; color:#36576f; text-align:left; text-transform:none; letter-spacing:0; border-bottom:1px solid #c9d7e1; }
.co-brief td { padding:7px 6px; font-size:10px; line-height:1.3; vertical-align:top; border-bottom:1px solid #dce4eb; overflow-wrap:anywhere; }

.brief-priorities td:first-child .brief-excerpt { -webkit-line-clamp:2; font-weight:700; }
.brief-record-id { margin-bottom:4px; font-size:8px; white-space:nowrap; }

.brief-side>section { border:1px solid #d5dfe7; padding:10px; margin-bottom:9px; }
.brief-stat { display:flex; justify-content:space-between; align-items:baseline; gap:6px; padding:3px 0; font-size:10px; }
.brief-stat span { min-width:0; }.brief-stat strong{white-space:nowrap;color:#173f60}
.brief-side h3 { margin:8px 0 3px; font-size:10px; color:#536c80; }
.brief-side p { font-size:10px; margin:3px 0; }
.brief-schedule { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:5; overflow:hidden; white-space:pre-wrap; }
.brief-footer { display:flex; justify-content:space-between; gap:14px; padding-top:7px; border-top:1px solid #c9d7e1; color:#536c80; font-size:8px; }
.brief-footer span:last-child { white-space:nowrap; }

.brief-main,.brief-side { min-height:0; }
.brief-record-id { margin-bottom:3px; }
.brief-assistance { margin-top:9px; }

.brief-stat { padding:2px 0; }
.brief-stat span { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
.brief-priorities td:last-child>strong { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.brief-priorities td:last-child small { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
.brief-header h1 { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }

  body.overview-reporting > :not(#overview-report-root) { display:none!important; }

}

  var key='casrep-command-appearance-v1';
  function apply(value){document.documentElement.dataset.theme=value==='dark'?'dark':'light';var button=document.getElementById('appearance-toggle');if(button){button.setAttribute('aria-pressed',value==='dark'?'true':'false');button.textContent=value==='dark'?'Light mode':'Dark mode';}}
  var selected='light';try{selected=localStorage.getItem(key)||'light';}catch(error){}apply(selected);
  document.addEventListener('DOMContentLoaded',function(){apply(selected);document.getElementById('appearance-toggle').addEventListener('click',function(){selected=document.documentElement.dataset.theme==='dark'?'light':'dark';apply(selected);try{localStorage.setItem(key,selected);}catch(error){}});});
  window.addEventListener('storage',function(event){if(event.key===key){selected=event.newValue||'light';apply(selected);}});
})();

<script id="casrep-routing-queue">
(function(root){
  'use strict';
  const stages=Object.freeze(['Draft','In review','Ready for release','Release authorized']);
  function owner(r){
    if(r.caseStatus!=='Active')return 'Reporting closed';
    if(r.stage==='Draft')return 'Sailor / LPO';
    if(r.stage==='In review'){const next=(r.reviews||[]).find(v=>v.status!=='Concurred');return next?next.label:'Review complete';}
    if(r.stage==='Ready for release')return 'CO release';
    if(r.stage==='Release authorized')return 'Message transmission';
    return r.stage==='Transmitted'?'Delivery verification':'Delivery verified';
  }
  function timestamp(value){const at=Date.parse(value);return Number.isFinite(at)?at:null;}
  function build(records,filters={},now=Date.now()){
    const eligible=records.filter(r=>r.caseStatus==='Active'&&stages.includes(r.stage));
    const owners=Array.from(new Set(eligible.flatMap(r=>[owner(r),owner(r).split(' · ')[0]]))).sort();
    const query=String(filters.routeSearch||'').trim().toLowerCase();
    const matches=eligible.filter(r=>(!filters.routeCategory||filters.routeCategory==='all'||r.category===filters.routeCategory)&&
      (!filters.routeOwner||filters.routeOwner==='all'||owner(r)===filters.routeOwner||owner(r).split(' · ')[0]===filters.routeOwner)&&
      (!query||[r.number,r.title,r.equipment].join(' ').toLowerCase().includes(query)));
    const counts=Object.fromEntries(stages.map(stage=>[stage,matches.filter(r=>r.stage===stage).length]));
    const priority={overdue:0,required:1,due:2,missing:3,soon:4,scheduled:5,unsupported:6,unsubmitted:7};
    const ranked=matches.filter(r=>!filters.routeStage||filters.routeStage==='all'||r.stage===filters.routeStage).map(record=>{
      const due=root.CasrepReporting.resolve(record,now);
      return {record,rank:priority[due.status]??8,due:timestamp(due.dueAt)??Infinity,updated:timestamp(record.updatedAt)??timestamp(record.createdAt)};
    });
    ranked.sort((a,b)=>{
      let order=0;
      if(filters.routeSort==='oldest'||filters.routeSort==='newest'){
        order=a.updated===null?(b.updated===null?0:1):b.updated===null?-1:(a.updated-b.updated)*(filters.routeSort==='newest'?-1:1);
      }else if(filters.routeSort==='category')order=Number(String(b.record.category).slice(1))-Number(String(a.record.category).slice(1));
      return order||a.rank-b.rank||(a.due===b.due?0:a.due-b.due)||String(a.record.number||'').localeCompare(String(b.record.number||''),undefined,{numeric:true})||String(a.record.id).localeCompare(String(b.record.id));
    });
    return {rows:ranked.map(item=>item.record),counts,total:eligible.length,matching:matches.length,owners};
  }
  root.CasrepRoutingQueue=Object.freeze({stages,owner,build});
})(globalThis);

<script id="casrep-overview-summary">
(function(root){
  'use strict';
  var DAY=86400000;
  function build(records,now){
    var at=now===undefined?Date.now():Date.parse(now);if(!Number.isFinite(at))throw new Error('Invalid overview date.');
    var clock=new Date(at),today=Date.UTC(clock.getUTCFullYear(),clock.getUTCMonth(),clock.getUTCDate());
    var ends={today:today+DAY,week:today+(7-(clock.getUTCDay()+6)%7)*DAY,month:Date.UTC(clock.getUTCFullYear(),clock.getUTCMonth()+1,1)};
    var groups=new Map(),missing=0;
    records.forEach(function(r,index){
      var fields=r.traffic&&r.traffic.text?root.CasrepDocument.fields(r.traffic.text):{};
      var number=r.casualtyNumber||fields.casualtyNumber||r.number;
      if(!number||/\[|\]|^NEW DRAFT$/i.test(number)){number=r.id||'missing-'+index;if(!r.id)missing++;}
      var key=JSON.stringify([r.profile||'',String(r.command||fields.from||'').toUpperCase(),String(number).toUpperCase()]);
      var previous=groups.get(key),time=function(v){return Date.parse(v.updatedAt||v.createdAt)||0;};
      if(!previous||time(r)>time(previous)||time(r)===time(previous)&&Number(r.revision||0)>Number(previous.revision||0))groups.set(key,r);
    });
    // A closure draft is still Active. Only persisted reporting closure removes it.
    var active=Array.from(groups.values()).filter(function(r){return r.caseStatus==='Active';});
    var result={active:active,categories:{C2:0,C3:0,C4:0},periods:{today:[],week:[],month:[]},overdue:0,withoutDeadline:0,duplicateRows:records.length-groups.size,missingIdentity:missing};
    active.forEach(function(r){
      if(Object.hasOwn(result.categories,r.category))result.categories[r.category]++;
      var due=Date.parse(root.CasrepReporting.resolve(r,at).dueAt);
      if(!Number.isFinite(due)){result.withoutDeadline++;return;}
      if(due<today)result.overdue++;
      Object.keys(ends).forEach(function(period){if(due>=today&&due<ends[period])result.periods[period].push(r.id);});
    });
    return result;
  }
  root.CasrepOverviewSummary=Object.freeze({build:build});
})(typeof window==='undefined'?globalThis:window);

  function relationshipsView(data) {
    data=data||{};
    var edges=(Array.isArray(data.relationships)?data.relationships:[]).filter(function(e){return e&&e.sourceType&&e.targetType&&e.sourceId&&e.targetId;});
    if(!edges.length)return empty('No recorded relationships in this scope','Link CASREPs to known systems, equipment models, part numbers and observed fault descriptions.');
    var entities=new Map();
    function identity(type,id){return JSON.stringify([String(type),String(id)]);}
    function addEntity(type,id,label,caseIds){
      var key=identity(type,id),entity=entities.get(key);
      if(!entity){entity={key:key,type:String(type),id:String(id),label:String(label||id),caseIds:new Set()};entities.set(key,entity);}
      (Array.isArray(caseIds)?caseIds:[]).forEach(function(caseId){entity.caseIds.add(String(caseId));});
    }
    edges.forEach(function(e){addEntity(e.sourceType,e.sourceId,e.sourceLabel,e.caseIds);addEntity(e.targetType,e.targetId,e.targetLabel,e.caseIds);});
    var order={system:0,model:1,equipment:2,part:3,failureMode:4};
    var catalog=Array.from(entities.values()).sort(function(a,b){return (order[a.type]==null?9:order[a.type])-(order[b.type]==null?9:order[b.type])||a.label.localeCompare(b.label)||a.id.localeCompare(b.id);});
    var filter=state.relationType||'all';
    if(filter!=='all'&&!catalog.some(function(e){return e.type===filter;})){filter='all';state.relationType='all';}
    var visible=catalog.filter(function(e){return filter==='all'||e.type===filter;});
    var selection=state.relationSelection||{},selected=entities.get(identity(selection.type||'',selection.id||''));
    if(!selected||(filter!=='all'&&selected.type!==filter))selected=visible[0]||catalog[0];
    state.relationSelection={type:selected.type,id:selected.id};
    var direct=edges.filter(function(e){return identity(e.sourceType,e.sourceId)===selected.key||identity(e.targetType,e.targetId)===selected.key;});
    var neighbors=new Map();
    direct.forEach(function(e){
      var incoming=identity(e.targetType,e.targetId)===selected.key,type=incoming?e.sourceType:e.targetType,id=incoming?e.sourceId:e.targetId,label=incoming?e.sourceLabel:e.targetLabel,key=identity(type,id),neighbor=neighbors.get(key);

    });

    var hub='<div class="relationship-focus-card"><div><span class="eyebrow">'+relationshipTypeLabel(selected.type)+(relationshipProfile(selected.id)?' · '+relationshipProfile(selected.id):'')+'</span><h3>'+esc(selected.label)+'</h3><p>'+selected.caseIds.size+' distinct CASREP'+(selected.caseIds.size===1?'':'s')+' · '+related.length+' direct connection'+(related.length===1?'':'s')+'</p></div><span class="relationship-hub-icon">'+icon(selected.type==='part'?'logistics':selected.type==='system'?'activity':'equipment',25)+'</span></div>';
    var nodes='<div class="relationship-neighbors">'+related.map(function(neighbor){return '<button class="relationship-node" type="button" data-relation-type="'+esc(neighbor.type)+'" data-relation-id="'+esc(neighbor.id)+'"><small>'+relationshipTypeLabel(neighbor.type)+(relationshipProfile(neighbor.id)?' · '+relationshipProfile(neighbor.id):'')+'</small><strong>'+esc(neighbor.label)+'</strong><span>'+neighbor.caseIds.size+' supporting case'+(neighbor.caseIds.size===1?'':'s')+' '+icon('arrow',14)+'</span></button>';}).join('')+'</div>';
    var table='<div class="relationship-table"><table><thead><tr><th>Recorded connection</th><th>Basis</th><th>Cases</th><th>Evidence</th></tr></thead><tbody>'+direct.map(function(edge){var ids=Array.from(new Set(edge.caseIds||[]));return '<tr><td><strong>'+esc(edge.sourceLabel||edge.sourceId)+'</strong><span class="relationship-direction">'+icon('arrow',13)+'</span><strong>'+esc(edge.targetLabel||edge.targetId)+'</strong><span class="cell-meta">'+relationshipTypeLabel(edge.sourceType)+' → '+relationshipTypeLabel(edge.targetType)+'</span></td><td>'+badge(edge.basis||'Recorded link',edge.basis==='Shared reported feature'?'badge-amber':'badge-blue')+'</td><td>'+ids.length+'</td><td><button class="btn btn-small" type="button" data-relation-evidence="'+esc(edge.id)+'">View '+ids.length+' CASREP'+(ids.length===1?'':'s')+' '+icon('arrow',13)+'</button></td></tr>';}).join('')+'</tbody></table></div>';

  async function applyShipSchedule(setting){
    var result={updated:0,returned:0,flagged:0,unchanged:0,failed:[]};
    for(var original of store.all().filter(function(r){return r.caseStatus==='Active';})){
      var returned=false;
      try{
        var r=store.get(original.id),traffic=Doc.traffic(r);
        var same=function(value){return String(value||'').trim().replace(/\s+/g,' ');};
        if(same(Doc.fields(traffic.text).schedule)===same(setting.text)){result.unchanged++;continue;}
        var guard={expectedRevision:r.revision,expectedStage:r.stage,expectedDigest:Doc.digest(traffic.text),actorId:'originator'};
        if(['Draft','In review','Ready for release'].includes(r.stage)){
          // Prepare the edit before returning a report, so malformed traffic stays in its current stage.
          traffic.text=scheduleText(traffic.text,setting.text);
          if(r.stage!=='Draft'){
            r=await store.transition(r.id,'return',Object.assign({},guard,{note:'Shared ship schedule changed; apply the new schedule and submit for fresh review.'}));
            returned=true;result.returned++;
          }
          await store.upsert({traffic:traffic,expectedRevision:r.revision,expectedStage:'Draft',expectedDigest:Doc.digest(Doc.traffic(r).text),actorId:'originator'},r.id);
          result.updated++;
        }else{
          var flagged=await store.requireUpdate(r.id,Object.assign({},guard,{kind:'schedule',detail:'Ship schedule changed: '+setting.text}));
          if(!flagged.reporting||!(flagged.reporting.pendingChanges||[]).some(function(change){return change.kind==='schedule';}))throw new Error('Record the submission date before an update can be flagged.');
          result.flagged++;
        }
      }catch(error){result.failed.push(original.number+': '+(returned?'Returned to Draft; schedule save failed. ':'')+error.message);}
    }
    return result;
  }

        editorSessions.forEach(function(current,currentKey){if(current===session||currentKey===key||currentKey===id){current.deleted=true;current.dirty=false;clearTimeout(current.autoTimer);editorSessions.delete(currentKey);}});
        try{var recovery=readEditorRecovery();[key,id].filter(Boolean).forEach(function(value){delete recovery[value];if(recovery.last===value)delete recovery.last;});localStorage.setItem(editorRecoveryKey(),JSON.stringify(recovery));}catch(error){/* Saved IDs cannot reopen after deletion, even without a recovery cache. */}
        if(assistantReturn&&(assistantReturn.editorKey===key||assistantReturn.editorKey===id))assistantReturn={view:'casreps',editorKey:null,record:null};
        if(state.editorKey===key||state.editorKey===id||state.record===id)navigate('casreps');else render();
        toast('CASREP deleted.');return true;
      }catch(error){if(session){session.deleting=false;session.busy=false;if(session.dirty)scheduleEditorSave(session);}throw error;}
    });
    $('#action-form [type="submit"]').classList.add('btn-danger');
    // Focus Cancel so an accidental Enter does not confirm a permanent deletion.
    $('#action-form [data-close-modal]').focus();
  }
  function action(name,id) {
    if(name==='delete-case')return confirmDeleteCase(id||state.editorKey);
    if(name==='export-overview')return openOverviewReport();
    if(name==='configure-route')return configureRoute();
    if(name==='edit-ship-schedule')return editShipSchedule();
    var r=state.record?store.get(state.record):null;
    if(name==='notifications')return openNotifications();if(name==='update-schedule')return openUpdateSchedule();if(name==='submission-date')return recordSubmissionDate();if(name==='report-change')return recordReportChange();
    if(name==='registry-filters')return registryFilters();if(name==='clear-routing-filters'){state.routeSearch='';state.routeCategory='all';state.routeStage='all';state.routeOwner='all';resetRoutingPages();render();$('#routing-search').focus();return;}
    if(name==='new-casrep')return editCase();if(name==='new-plad')return editPlad();if(name==='new-work')return editWork();if(name==='new-requisition')return editReq(null,id);if(name==='req-edit')return editReq(id);if(name==='req-comment')return requisitionComments(id);if(name==='req-delivery')return requisitionDelivery(id);if(name==='link-draft-equipment')return linkDraftEquipment();if(name==='edit-case')return editCase(id||state.record);
    if(name==='clear-filters'){state.overviewPeriod='';listPages.registry=0;state.search='';state.category='all';state.stage='all';state.dueFilter='all';return render();}
    if(name==='return-case')return modal('Return for revision',field('Reason *','note','','textarea',true,'required'),'Return draft',function(v){return execute(async function(){await store.transition(r.id,'return',Object.assign(editorPayload(),v));var s=editorSession();s.actor='originator';s.pane='message';s.tool='write';},'Returned for revision.');});
    if(name==='transmit')return modal('Record transmission','<p class="form-intro">Record a handoff already performed in the scenario. This action sends no message.</p><div class="form-grid">'+field('DTG / reference *','dtg',r.dtg||'','text',true,'required')+field('Reviewed recipient scope *','recipients',r.recipients||'','textarea',true,'required readonly')+field('Channel / evidence notes','note','','textarea',true)+'</div>','Record transmission',function(v){return execute(function(){return store.transition(r.id,'transmit',Object.assign(editorPayload(),v));},'Transmission recorded. Delivery remains separate.');});
    if(name==='deliver')return modal('Record delivery evidence',field('Evidence and required recipient scope *','note','','textarea',true,'required')+field('Required recipients still pending (if any)','pendingRecipients','','textarea',true),'Record delivery evidence',function(v){return execute(function(){return store.transition(r.id,'deliver',Object.assign(editorPayload(),v));},'Delivery evidence recorded.');});
    if(name==='followup')return modal('Create follow-on draft','<p class="form-intro">The transmitted version stays in the case history. The follow-on starts a fresh review.</p><div class="form-grid">'+selectField('Report type','type',[['UPDATE','UPDATE / CASUP'],['CORRECT','CORRECT / CASCOR'],['CANCEL','CANCEL / CASCAN']],'CORRECT')+'</div>','Create draft',function(v){return execute(function(){return store.transition(r.id,'followup',Object.assign(editorPayload(),v));},'Follow-on draft created.');});
    if(name==='close-case')return modal('Close reporting case','<p class="form-intro">Closure applies to reporting. Maintenance and parts records keep their independent status.</p>'+field(r.messageType==='CORRECT'?'Restoration / operational test evidence *':'Cancellation authority / unresolved condition *','evidence','','textarea',true,'required')+(r.messageType==='CORRECT'?field('Actual restoration time (local) *','restoredAt',localDate(r.restoredAt),'datetime-local',true,'required'):''),'Close reporting',function(v){return execute(function(){v.restoredAt=preservedISO(v.restoredAt,r.restoredAt);return store.transition(r.id,'close',Object.assign(editorPayload(),v));},'Reporting case closed.');});
    if(name==='reset')return modal('Reset workspace','<p>This restores the initial cases and W requisitions. Saved PLAD templates are retained.</p>','Reset workspace',function(){store.reset();material.reset();sheetClose();state.profile='FLEET';render();toast('Workspace reset.');});
  }
  document.addEventListener('click',function(e){if(!store)return;if(e.target.classList.contains('sheet-backdrop'))return sheetClose();var b=e.target.closest('button,a');if(!b)return;if(intelligenceClick(b)){e.preventDefault();return;}if(b.dataset.duePage!=null)return loadDuePage(Number(b.dataset.duePage));if(b.dataset.categoryJump)return overviewScope('active',b.dataset.categoryJump);if(b.dataset.overviewPeriod)return overviewScope(b.dataset.overviewPeriod);if(b.dataset.routingStage){navigate('routing');state.routeStage=b.dataset.routingStage;resetRoutingPages();render();return;}if(b.dataset.failureBasis){state.failureBasis=b.dataset.failureBasis;return render();}if(b.dataset.view)return navigate(b.dataset.view);if(b.dataset.profile){state.profile=b.dataset.profile;return render();}if(b.dataset.open){if($('#modal-root').innerHTML)closeModal();return openRecord(b.dataset.open);}if(b.hasAttribute('data-close-sheet'))return sheetClose();if(b.hasAttribute('data-close-modal'))return closeModal();if(b.dataset.tab){state.tab=b.dataset.tab;return renderSheet();}if(b.dataset.analysisGroup)return inspectGroup(b.dataset.analysisGroup,b.dataset.key);if(b.dataset.action)return action(b.dataset.action,b.dataset.id);if(b.dataset.transition)return execute(function(){if(state.editorKey&&b.dataset.transition==='submit')return editorAction('submit');return store.transition(state.record,b.dataset.transition,state.editorKey?editorPayload():{});},'Workflow updated.');if(b.dataset.concur)return execute(function(){if(!state.editorKey||!canReviewEditor()||editorSession().actor!=='demo-'+b.dataset.concur)throw new Error('Open the current role from Review & release to approve this revision.');return store.transition(state.record,'concur',Object.assign(editorPayload(),{reviewId:b.dataset.concur}));},'Review concurrence recorded.');if(b.dataset.plad)return editPlad(b.dataset.plad);if(b.dataset.asset)return equipmentDetail(b.dataset.asset);if(b.dataset.work)return editWork(b.dataset.work);if(b.dataset.requisition)return editReq(b.dataset.requisition);});
  document.addEventListener('change',function(e){if(!store)return;if(intelligenceChange(e))return;if(e.target.id==='due-horizon'){state.dueHorizon=e.target.value;return backend.connected?loadDuePage(0):render();}if(e.target.id==='analysis-window'){state.analysisWindow=e.target.value;return render();}if(e.target.name==='pladTemplateId'){var template=pladStore.get(e.target.value),recipients=$('[name="recipients"]',$('#action-form'));if(template&&recipients)recipients.value=template.recipients;return;}if(e.target.name==='assetId'&&$('#action-form [name=equipment]')){var a=material.assets().find(function(a){return a.id===e.target.value;});if(a){['equipment','system','location'].forEach(function(key){var el=$('#action-form [name='+key+']');if(el)el.value=key==='equipment'?a.name:a[key];});}}if(e.target.id==='due-filter'){state.dueFilter=e.target.value;return render();}if(e.target.id==='category-filter'){state.category=e.target.value;return render();}if(e.target.id==='stage-filter'){state.stage=e.target.value;return render();}if(e.target.dataset.workStatus)return execute(function(){return material.setWorkStatus(e.target.dataset.workStatus,e.target.value);},'Work status saved.');if(e.target.dataset.reqStatus)return execute(function(){var oldReq=material.requisitions().find(function(r){return r.id===e.target.dataset.reqStatus;});return Promise.resolve(material.setReqStatus(e.target.dataset.reqStatus,e.target.value)).then(function(savedReq){if(!backend.connected&&oldReq&&oldReq.status!==savedReq.status&&savedReq.casrepId)return store.requireUpdate(savedReq.casrepId,{kind:'parts',detail:'Material status changed: '+savedReq.number+' · '+savedReq.status+'.'});});},'Material status saved.');});
  document.addEventListener('input',function(e){if(recurrenceInput(e))return;if(e.target.id==='ai-question'){state.aiQuestion=e.target.value;if(state.aiResult){var aiText=e.target.value,aiPos=e.target.selectionStart;clearTimeout(state.aiTypingTimer);state.aiTypingTimer=setTimeout(function(){render();var input=$('#ai-question');if(input){input.focus();input.setSelectionRange(aiPos,aiPos);}},550);}return;}if(e.target.id==='case-search'){state.search=e.target.value;var focus=e.target.selectionStart;var rows=registryRows();listPages.registry=0;$('#registry-results').innerHTML=registryTable(rows);$('#registry-count').textContent=rows.length+' of '+cases().length+' records';e.target.setSelectionRange(focus,focus);}if(e.target.id==='equipment-search'){state.equipmentSearch=e.target.value;var pos=e.target.selectionStart;render();$('#equipment-search').focus();$('#equipment-search').setSelectionRange(pos,pos);}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){if($('#modal-root').innerHTML)closeModal();}if(e.key==='Tab'){var dialog=$('#modal-root .modal')||$('.detail-sheet');if(!dialog)return;var focusable=$$('button:not([disabled]),input,select,textarea,a[href],[tabindex="0"]',dialog).filter(function(el){return el.offsetParent!==null;});if(!focusable.length)return;var first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  $('#menu-toggle').addEventListener('click',function(){$('#app').classList.toggle('sidebar-open');});$('#policy-shortcut').addEventListener('click',function(){navigate('policy');});window.addEventListener('hashchange',function(){if(!store)return;var view=location.hash.slice(1);if(assistantBusy()){history.replaceState(null,'','#assistant');return;}if(view==='assistant')return; if(view.startsWith('casrep/')){var key=decodeURIComponent(view.slice(7));if(key!==state.editorKey||state.view==='assistant'){try{showEditor(key==='new'?null:key,true);}catch(error){toast(error.message,true);navigate('casreps');}}}else if(Object.hasOwn(views,view)&&(view!==state.view||state.editorKey)){state.editorKey=null;state.record=null;state.view=view;render();if(view==='routing')restoreRoutingPosition();}else if(!Object.hasOwn(views,view))navigate('overview');});function initializeRoute(){var initialHash=location.hash.slice(1);if(!initialHash){var resume=readEditorRecovery().last;if(resume&&(resume==='new'||store.all().some(function(r){return r.id===resume&&r.stage==='Draft';})))initialHash='casrep/'+encodeURIComponent(resume);}if(initialHash==='assistant'){openAssistantPage(true);return;}if(initialHash.startsWith('casrep/')){try{var initialKey=decodeURIComponent(initialHash.slice(7));showEditor(initialKey==='new'?null:initialKey,true);}catch(error){navigate('casreps');toast(error.message,true);}}else{state.view=Object.hasOwn(views,initialHash)?initialHash:'overview';history.replaceState(null,'','#'+state.view);render();}}
  function refreshReportingData(){
    if(!store)return;
    if(!backend.connected)return refreshReportingUI();
    if(backend.refreshing||Array.from(editorSessions.values()).some(function(s){return s.busy||s.savePromise;}))return;
    backend.refreshing=true;
    store.reload().then(function(){refreshReportingUI();return loadDuePage(backend.due.offset,true);}).catch(function(error){toast('Backend refresh failed. '+error.message,true);}).finally(function(){backend.refreshing=false;});
  }
  setInterval(refreshReportingData,60000);
  window.addEventListener('focus',refreshReportingData);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)refreshReportingData();});
  document.addEventListener('click',function(e){var menu=$('#editor-more');if(menu&&!menu.contains(e.target))menu.open=false;});
  window.ReadinessApp={store:store,material:material,state:state,render:render,openRecord:openRecord,pladStore:pladStore};
  window.ReadinessApp.departmentAnalysis={snapshot:function(){return JSON.parse(JSON.stringify(departmentSnapshot()));},packet:departmentPacket,applyAgentResult:applyDepartmentAgentResult};
  $('#main').innerHTML='<section class="panel"><div class="panel-body">Loading workspace…</div></section>';
  installTableNavigation();
  connectBackend().then(function(){startAssistant();if(backend.connected)backend.due.loading=true;initializeRoute();if(backend.connected)loadDuePage(0,true);}).catch(function(error){
    backend.loading=false;$('#save-status').textContent='Data connection unavailable';$('#storage-description').textContent='Data connection unavailable.';
    $('#main').innerHTML='<section class="panel"><div class="panel-body"><h1>Workspace could not load</h1><p>'+esc(error.message)+'</p><p>Saved records have not been replaced. Restore the data connection and retry.</p><button class="btn btn-primary" id="retry-workspace">Retry connection</button></div></section>';
    $('#retry-workspace').addEventListener('click',function(){location.reload();});
  });
})();
