---
name: backend

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Check documentation sync
        shell: bash
        run: |
          zero_sha=0000000000000000000000000000000000000000
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "$zero_sha" ]; then
            base="${{ github.event.before }}"
          else
            base="HEAD^"
          fi
          DOC_SYNC_BASE="$base" node backend/scripts/check-doc-sync.cjs
      - name: Test backend
        working-directory: backend
        run: go test ./...
      - name: Vet backend
        working-directory: backend
        run: go vet ./...
      - name: Test prototype model
        run: node tests/casrep-document.test.cjs
