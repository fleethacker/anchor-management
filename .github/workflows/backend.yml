---
name: backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27'
          cache: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check documentation sync
        shell: bash
        run: |
          zero_sha=0000000000000000000000000000000000000000
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            candidate="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "$zero_sha" ]; then
            candidate="${{ github.event.before }}"
          else
            candidate="HEAD^"
          fi
          if git rev-parse --verify "${candidate}^{commit}" >/dev/null 2>&1 && \
            git merge-base --is-ancestor "$candidate" HEAD; then
            base="$candidate"
          else
            base="$(git merge-base HEAD "origin/${{ github.event.repository.default_branch }}")"
          fi
          DOC_SYNC_BASE="$base" node backend/scripts/check-doc-sync.cjs
      - name: Test backend
        working-directory: backend
        run: go test ./...
      - name: Vet backend
        working-directory: backend
        run: go vet ./...
      - name: Test prototype model
        run: node --test tests/casrep-notifications.test.cjs tests/casrep-routing-queue.test.cjs tests/casrep-schedule-application.test.cjs tests/casrep-editor-schedule.test.cjs tests/casrep-document.test.cjs tests/casrep-reporting.test.cjs tests/casrep-api-client.test.cjs tests/casrep-overview-report.test.cjs tests/casrep-overview-summary.test.cjs tests/casrep-security-boundaries.test.cjs tests/casrep-department-analysis.test.cjs tests/casrep-department-ui.test.cjs tests/casrep-chat-controls.test.cjs tests/casrep-assistant.test.cjs tests/casrep-draft-composer.test.cjs tests/casrep-assistant-portal.test.cjs backend/scripts/casrep-workflow.test.cjs backend/scripts/migrate-demo-traffic.test.cjs
      - name: Install browser test dependencies
        run: npm ci
      - name: Test package build and versioning
        run: npm run test:package
      - name: Cache Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
