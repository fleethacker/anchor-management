---
name: backend

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Check documentation sync
        shell: bash
        run: |
          zero_sha=0000000000000000000000000000000000000000
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "$zero_sha" ]; then
            base="${{ github.event.before }}"
          else
            base="HEAD^"
          fi
          DOC_SYNC_BASE="$base" node backend/scripts/check-doc-sync.cjs
      - name: Test backend
        working-directory: backend
        run: go test ./...
      - name: Vet backend
        working-directory: backend
        run: go vet ./...
      - name: Test prototype model
        run: node --test tests/casrep-document.test.cjs tests/casrep-reporting.test.cjs tests/casrep-api-client.test.cjs backend/scripts/casrep-workflow.test.cjs backend/scripts/migrate-demo-traffic.test.cjs
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Verify packaged CASREP rules
        shell: bash
        run: |
          docker build -f backend/Dockerfile -t casrep-backend:test .
          docker run --rm -i --entrypoint node casrep-backend:test \
            /app/scripts/casrep-workflow.cjs /app/static/index.html <<'JSON' > /tmp/casrep-container-result.json
          {"action":"save","cases":[],"now":"2026-11-04T12:00:00Z","payload":{"title":"EXERCISE CONTAINER","equipment":"DEMO PUMP"}}
          JSON
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const result = require('/tmp/casrep-container-result.json');
          assert.equal(result.record.stage, 'Draft');
          assert.equal(result.record.title, 'EXERCISE CONTAINER');
          NODE
