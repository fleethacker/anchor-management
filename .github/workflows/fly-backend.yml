---
name: deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'index.html'
      - 'frontend-config.js'
      - '.github/workflows/fly-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: fly-production
      url: https://anchor-management-api.fly.dev
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy backend
        run: flyctl deploy . --config backend/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
