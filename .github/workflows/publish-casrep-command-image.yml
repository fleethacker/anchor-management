---
name: publish casrep-command image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/casrep-command

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
      - name: Check release tag matches package version
        if: github.ref_type == 'tag'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = fs.readFileSync('zarf.yaml', 'utf8').match(/^  version: ([0-9]+\.[0-9]+\.[0-9]+)$/m)?.[1];
          if (!version || process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Release tag must match zarf.yaml metadata.version; use uds run set-version first.');
          }
          NODE
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - id: build-metadata
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - name: Build architecture candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          pull: true
          tags: anchor-management:publish-${{ matrix.arch }}
          labels: ${{ steps.build-metadata.outputs.labels }}
          cache-from: type=gha,scope=anchor-management-api-publish-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=anchor-management-api-publish-${{ matrix.arch }},ignore-error=true
      - name: Require zero image findings
        uses: ./.github/actions/scan-image
        with:
          image: anchor-management:publish-${{ matrix.arch }}
          artifact-name: publish-image-security-${{ matrix.arch }}
      - name: Export scanned image
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save --output "$RUNNER_TEMP/image-$ARCH.tar" "anchor-management:publish-$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-archive-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-archive-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - id: metadata
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned images and multi-architecture manifest
        shell: bash
        env:
          RELEASE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          digests=()
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/images/image-$arch.tar"
            image="${REGISTRY}/${IMAGE_NAME}:scanned-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${arch}"
            docker tag "anchor-management:publish-$arch" "$image"
            docker push "$image"
            digests+=("$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")")
          done
          tags=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then tags+=(--tag "$tag"); fi
          done <<< "$RELEASE_TAGS"
          test "${#tags[@]}" -gt 0
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"
