---
name: deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CASREP_API_BASE: ${{ vars.CASREP_API_BASE }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
      - name: Verify backend compatibility
        shell: bash
        run: |
          node - <<'NODE'
          const base = (process.env.CASREP_API_BASE || '').trim().replace(/\/+$/, '');
          if (!base) {
            console.log('No remote API configured; publishing the static prototype.');
            process.exit(0);
          }
          async function check() {
            const required = ['casrep-workflow-v1', 'casrep-deadlines-v1', 'command-admin-v1', 'casrep-line-wrap-v1', 'casrep-routing-edit-v1', 'casrep-delete-v1', 'casrep-command-tools-v1'];
            let lastError;
            for (let attempt = 1; attempt <= 20; attempt++) {
              try {
                const response = await fetch(base + '/health?check=casrep', {
                  signal: AbortSignal.timeout(30000)
                });
                if (!response.ok) throw new Error('Backend readiness returned HTTP ' + response.status);
                const body = await response.json();
                if (!required.every(value => body.data?.capabilities?.includes(value))) {
                  throw new Error('The configured API does not yet support the CASREP editor and deadlines.');
                }
                console.log('Backend CASREP workflow and deadline rules are ready.');
                return;
              } catch (error) {
                lastError = error;
                if (attempt < 20) {
                  console.log('Backend is not ready yet; retrying in 15 seconds (' + attempt + '/20).');
                  await new Promise(resolve => setTimeout(resolve, 15000));
                }
              }
            }
            throw lastError;
          }
          check().catch(error => {
            console.error('::error::' + error.message + ' Deploy the updated Fly API with `fly deploy . --config backend/fly.toml`, then rerun this workflow. The existing Pages site has not been replaced.');
            process.exitCode = 1;
          });
          NODE
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build static frontend
        shell: bash
        run: |
          mkdir -p _site
          node - <<'NODE'
          const fs = require('node:fs');
          const value = process.env.CASREP_API_BASE || '';
          const config = '<script>window.CASREP_API_BASE = ' +
            JSON.stringify(value) + ';</script>';
          const html = fs.readFileSync('index.html', 'utf8').replace(
            '<script src="frontend-config.js"></script>', config
          );
          fs.writeFileSync('_site/index.html', html);
          NODE
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
