---
name: deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CASREP_API_BASE: ${{ vars.CASREP_API_BASE }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build static frontend
        shell: bash
        run: |
          mkdir -p _site
          node - <<'NODE'
          const fs = require('node:fs');
          const value = process.env.CASREP_API_BASE || '';
          const config = '<script>window.CASREP_API_BASE = ' +
            JSON.stringify(value) + ';</script>';
          const html = fs.readFileSync('index.html', 'utf8').replace(
            '<script src="frontend-config.js"></script>', config
          );
          fs.writeFileSync('_site/index.html', html);
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
