apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "casrep-command.fullname" . }}
  labels:
    {{- include "casrep-command.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The file-backed store must have only one writer, including during upgrades.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "casrep-command.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "casrep-command.selectorLabels" . | nindent 8 }}
      {{- if or .Values.podAnnotations .Values.rolloutOnUpgrade }}
      annotations:
        {{- if .Values.rolloutOnUpgrade }}
        casrep-command.dev/release-revision: {{ .Release.Revision | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: casrep-command
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # The package image includes the verified model and llama-server.
            # Keep this configuration package-owned: the model is loopback-only
            # and must never be replaced with a caller-provided endpoint/path.
            - name: ASSISTANT_PROVIDER
              value: "local"
            - name: ASSISTANT_MODEL
              value: "smollm2-360m"
            - name: ASSISTANT_LOCAL_BINARY
              value: "/opt/llama/bin/llama-server"
            - name: ASSISTANT_LOCAL_MODEL_PATH
              value: "/models/smollm2-360m-instruct-q8_0.gguf"
            - name: ASSISTANT_LOCAL_CONTEXT_SIZE
              value: "4096"
            - name: ASSISTANT_LOCAL_MAX_TOKENS
              value: "600"
            - name: ASSISTANT_LOCAL_THREADS
              value: "2"
            - name: ASSISTANT_LOCAL_STARTUP_TIMEOUT
              value: "60s"
            - name: ASSISTANT_COOKIE_SECURE
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            # The API does not listen until llama-server has loaded the embedded
            # model. Allow the package-owned 60s startup budget before liveness.
            initialDelaySeconds: 75
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "casrep-command.fullname" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
