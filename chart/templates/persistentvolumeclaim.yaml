apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "casrep-command.fullname" . }}
  labels:
    {{- include "casrep-command.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
