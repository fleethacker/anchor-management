replicaCount: 1
# Local development reuses an image tag; roll the pod on each Helm upgrade.
rolloutOnUpgrade: false

image:
  repository: ghcr.io/fleethacker/casrep-command
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

persistence:
  size: 1Gi
  storageClass: ""

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 1Gi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
